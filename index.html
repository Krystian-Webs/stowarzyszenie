<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Event Kraft</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏁</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F5F6F3;--surface:#FFFFFF;--ink:#16202B;--muted:#5A6572;--line:#DCE0DA;--hover:#EEF0EC;
  --moss:#2F6B4F;--moss-bg:#E1EEE6;--moss-ink:#1F4A36;
  --bib:#F2C230;--bib-bg:#FBF0C9;--bib-ink:#5C4500;
  --gray-bg:#E9ECE8;--gray-ink:#3E4650;
  --danger:#B3261E;--danger-bg:#FBE7E5;
  --font:'Archivo',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#10151B;--surface:#19212A;--ink:#E8ECEF;--muted:#9AA5B0;--line:#2C3642;--hover:#222B35;
  --moss:#62B38D;--moss-bg:#1C3328;--moss-ink:#A9DCC3;
  --bib-bg:#3A3014;--bib-ink:#F7DD85;
  --gray-bg:#252E38;--gray-ink:#C6CDD4;
  --danger:#F2837B;--danger-bg:#3A1C1A;color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#10151B;--surface:#19212A;--ink:#E8ECEF;--muted:#9AA5B0;--line:#2C3642;--hover:#222B35;
  --moss:#62B38D;--moss-bg:#1C3328;--moss-ink:#A9DCC3;
  --bib-bg:#3A3014;--bib-ink:#F7DD85;
  --gray-bg:#252E38;--gray-ink:#C6CDD4;
  --danger:#F2837B;--danger-bg:#3A1C1A;color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--moss);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:20px 20px 60px}
img{max-width:100%}

.top{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:stretch;margin-bottom:20px}
.org h1{font-stretch:112%;font-weight:750;font-size:clamp(24px,4vw,34px);line-height:1.1;margin:0 0 6px;letter-spacing:-.01em}
.org p{margin:0;color:var(--muted);font-size:14px}
.org .acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.bib{background:var(--bib);color:#1B1600;border-radius:10px;padding:14px 20px 12px;min-width:220px;position:relative;display:flex;flex-direction:column;justify-content:center;border:0}
.bib::before,.bib::after{content:"";position:absolute;top:10px;width:7px;height:7px;border-radius:50%;background:var(--paper)}
.bib::before{left:10px}.bib::after{right:10px}
.bib .num{font-stretch:125%;font-weight:800;font-size:48px;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.bib .lbl{font-weight:600;font-size:15px}
.bib .dt{font-size:13px;opacity:.85}
.bib button{background:none;border:0;padding:0;text-align:left;color:inherit;font-weight:600;text-decoration:underline}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;font-weight:600;color:var(--muted);white-space:nowrap;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--moss)}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:600;font-size:14px}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--moss);border-color:var(--moss);color:#fff}
[data-theme="dark"] .btn.primary{color:#0D1A13}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{color:#0D1A13}}
.btn.danger{color:var(--danger)}
.btn.sm{padding:5px 10px;font-size:13px}

.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:18px}
.bar .grow{flex:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:7px 12px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
select.in,input.in,textarea.in{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;font-size:14px;width:100%}
.bar select.in{width:auto}
label.chk{display:inline-flex;gap:6px;align-items:center;font-size:14px;color:var(--muted)}

.tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:4px;white-space:nowrap}
.cat-stow{background:var(--moss-bg);color:var(--moss-ink)}
.cat-fort{background:var(--bib-bg);color:var(--bib-ink)}
.cat-inne{background:var(--gray-bg);color:var(--gray-ink)}

.group{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:16px;overflow:hidden}
.ghead{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.ghead h3{margin:0;font-size:17px;font-weight:700}
.ghead .sub{color:var(--muted);font-size:13px}
.ghead .cnt{margin-left:auto;font-size:13px;color:var(--muted);white-space:nowrap}
.row{display:flex;align-items:flex-start;gap:12px;padding:10px 16px;border-top:1px solid var(--line)}
.ghead+.row{border-top:0}
.row:hover{background:var(--hover)}
.row input[type=checkbox]{width:20px;height:20px;margin-top:2px;accent-color:var(--moss);flex:none}
.row .main{flex:1;min-width:0;background:none;border:0;padding:0;text-align:left}
.row .t{font-weight:600;display:block}
.row.done .t{text-decoration:line-through;color:var(--muted)}
.row .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:3px;font-size:13px;color:var(--muted)}
.late{color:var(--danger);font-weight:600}

.av{border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:700;background:var(--moss-bg);color:var(--moss-ink);overflow:hidden;font-stretch:110%}
.av img{width:100%;height:100%;object-fit:cover}

.empty{border:1.5px dashed var(--line);border-radius:12px;padding:36px 20px;text-align:center;color:var(--muted)}
.empty h3{color:var(--ink);margin:0 0 6px;font-size:18px}
.empty p{margin:0 0 16px}

.agenda .day{display:grid;grid-template-columns:120px 1fr;gap:16px;padding:14px 0;border-top:1px solid var(--line)}
.agenda .day:first-child{border-top:0}
.agenda .dl{font-weight:700;line-height:1.25}
.agenda .dl small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.agenda .items{display:flex;flex-direction:column;gap:6px}
.item{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px;text-align:left;width:100%}
.item:hover{border-color:var(--muted)}
.item .tm{font-variant-numeric:tabular-nums;font-weight:700;min-width:44px;font-size:14px}
.item .tt{flex:1;min-width:0}
.item .tt b{display:block;font-weight:600}
.item .tt span{font-size:13px;color:var(--muted)}
.item.special{background:var(--bib);border-color:var(--bib);color:#1B1600}
.item.special .tt span{color:#3B3000}
.item.isdone b{text-decoration:line-through;color:var(--muted)}
@media (max-width:600px){.agenda .day{grid-template-columns:1fr;gap:8px}}

.ptitle{font-stretch:112%;font-weight:750;font-size:20px;margin:0;text-transform:none}
.chip{display:block;width:100%;text-align:left;border:0;border-radius:4px;padding:2px 6px;font-size:12px;font-weight:600;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip.ev{box-shadow:inset 3px 0 0 currentColor}
.chip.done{text-decoration:line-through;opacity:.6}
.chip.special{background:var(--bib);color:#1B1600}
.chip .tm{font-variant-numeric:tabular-nums;margin-right:4px;font-weight:700}

.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.wcol{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px;min-height:180px}
.wcol.today{border-color:var(--moss);box-shadow:inset 0 3px 0 var(--moss)}
.dhead{background:none;border:0;padding:0;text-align:left;width:100%;margin-bottom:4px}
.dhead small{display:block;color:var(--muted);font-size:12px;font-weight:600}
.dhead b{font-size:20px;font-stretch:115%;font-weight:750}
@media (max-width:760px){.week{grid-template-columns:1fr}.wcol{min-height:0}}

.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--line);gap:1px}
.month .wd{background:var(--surface);font-size:12px;font-weight:700;color:var(--muted);padding:6px 8px}
.mcell{background:var(--surface);min-height:104px;padding:4px 6px 6px;min-width:0}
.mcell.out{background:var(--paper)}
.mcell.out .dn{color:var(--muted)}
.mcell .dn{background:none;border:0;padding:2px 4px;font-weight:700;font-size:14px;border-radius:4px}
.mcell.today .dn{background:var(--moss);color:#fff}
.mcell .more{font-size:12px;color:var(--muted);background:none;border:0;padding:2px 6px}
.mcell .dots{display:none}
@media (max-width:640px){.mcell{min-height:62px}.mcell .chip,.mcell .more{display:none}.mcell .dots{display:flex;gap:3px;flex-wrap:wrap;padding:2px 4px}.dot{width:7px;height:7px;border-radius:50%}}

.year{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.ymon{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.ymon h4{margin:0 0 6px;font-size:15px;font-weight:700;text-transform:capitalize}
.ymon h4 button{background:none;border:0;padding:0;font-weight:inherit}
.ygrid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;font-size:12px}
.ygrid .h{color:var(--muted);font-weight:600}
.ygrid button{border:0;background:none;padding:3px 0;border-radius:4px;font-variant-numeric:tabular-nums;font-size:12px}
.ygrid button.has{background:var(--moss-bg);color:var(--moss-ink);font-weight:700}
.ygrid button.race{background:var(--bib);color:#1B1600;font-weight:800}
.ygrid button.today{outline:2px solid var(--moss);outline-offset:-2px}

.team{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.pcard .ph{aspect-ratio:1/1;background:var(--moss-bg);color:var(--moss-ink);display:flex;align-items:center;justify-content:center;font-size:52px;font-weight:800;font-stretch:120%;border:0;padding:0;width:100%}
.pcard .ph img{width:100%;height:100%;object-fit:cover}
.pcard .bd{padding:12px 14px 14px;display:flex;flex-direction:column;gap:2px;flex:1}
.pcard .bd b{font-size:17px}
.pcard .bd span{color:var(--muted);font-size:14px}
.pcard .bd .btn{margin-top:10px;align-self:flex-start}
.pcard.add{border-style:dashed;align-items:center;justify-content:center;min-height:240px;background:none;color:var(--muted);font-weight:600;gap:6px}
.pcard.add .plus{font-size:40px;line-height:1;font-weight:300}

dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:0;width:min(520px,calc(100vw - 24px));max-height:calc(100dvh - 40px)}
dialog::backdrop{background:rgba(10,14,18,.45)}
dialog form{padding:20px}
dialog h2{margin:0 0 16px;font-size:20px;font-stretch:112%;font-weight:750}
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;font-size:14px;font-weight:600}
.fld .hint{font-weight:400;color:var(--muted);font-size:13px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dacts{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.dacts .left{margin-right:auto}
.err{color:var(--danger);font-size:13px;font-weight:600;min-height:1em}
.photo{display:flex;gap:14px;align-items:center;margin-bottom:12px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:8px;font-size:14px;font-weight:600;display:none;z-index:10;max-width:calc(100vw - 32px)}
.note{font-size:13px;color:var(--muted);margin-top:30px}
@media (max-width:640px){.top{grid-template-columns:1fr}.bib{min-width:0}}
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.logo{font-stretch:125%;font-weight:800;font-size:clamp(26px,4vw,36px);letter-spacing:-.02em;line-height:1;margin:0;background:none;border:0;padding:0;text-align:left}
.logo span{display:inline-block;background:var(--bib);color:#1B1600;padding:2px 8px 4px;border-radius:6px;margin-left:6px}
.topbar .who{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.banner{background:var(--bib-bg);color:var(--bib-ink);border-radius:10px;padding:10px 14px;font-size:14px;margin-bottom:18px}
.evgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.evcard{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;text-align:left;width:100%}
.evcard:hover{border-color:var(--muted)}
.evdate{background:var(--bib);color:#1B1600;border-radius:8px;width:62px;text-align:center;padding:6px 0 7px;line-height:1.05}
.evdate b{display:block;font-size:26px;font-stretch:125%;font-weight:800}
.evdate small{font-size:12px;font-weight:700;text-transform:uppercase}
.evdate.gen{background:var(--moss-bg);color:var(--moss-ink);font-size:22px;font-weight:800;padding:14px 0}
.evcard h3{margin:0 0 2px;font-size:18px;font-weight:700;line-height:1.25}
.evcard p{margin:0;color:var(--muted);font-size:14px}
.sect{font-size:15px;font-weight:700;color:var(--muted);margin:28px 0 10px}
.hero{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:18px}
.hero h2{margin:0 0 4px;font-size:clamp(22px,3.4vw,30px);font-stretch:115%;font-weight:800;line-height:1.15}
.hero .meta{color:var(--muted);font-size:15px}
.hero .desc{margin:12px 0 0;white-space:pre-wrap}
.namebox{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;max-width:560px}
.namebox h3{margin:0 0 4px;font-size:20px}
.namebox p{margin:0 0 14px;color:var(--muted)}
.inrow{display:flex;gap:8px;flex-wrap:wrap}
.inrow .in{flex:1;min-width:200px;font-size:16px;padding:10px 12px}
.inrow .btn{padding:10px 16px;font-size:15px}
.prog{height:8px;background:var(--gray-bg);border-radius:4px;overflow:hidden;margin:8px 0 4px}
.prog i{display:block;height:100%;background:var(--moss);border-radius:4px}
.mytask{display:flex;gap:14px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:8px;cursor:pointer}
.mytask input{width:24px;height:24px;accent-color:var(--moss);flex:none;margin:0}
.mytask b{display:block;font-size:17px}
.mytask span{display:block;color:var(--muted);font-size:14px;white-space:pre-wrap}
.mytask.done{background:var(--paper)}
.mytask.done b{text-decoration:line-through;color:var(--muted)}
.role{font-size:12px;font-weight:700;padding:2px 8px;border-radius:4px;white-space:nowrap}
.role-admin{background:var(--ink);color:var(--paper)}
.role-editor{background:var(--bib-bg);color:var(--bib-ink)}
.role-member{background:var(--gray-bg);color:var(--gray-ink)}
.roles-help{font-size:14px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin-bottom:16px}
.roles-help b{color:var(--ink)}
.center{max-width:440px;margin:30px auto}
.linklike{background:none;border:0;padding:0;color:var(--moss);font-weight:600;text-decoration:underline;font-size:inherit}
.evrow{display:flex;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;flex-wrap:wrap}
.evrow .grow{flex:1;min-width:180px}
.evrow h3{margin:0;font-size:17px}
.evrow p{margin:0;color:var(--muted);font-size:14px}
.evrow .prog{width:140px}
.loading{padding:60px 0;text-align:center;color:var(--muted)}

:root{--ts:#F2C230;--ts-ink:#1B1600;--tm:#6D4BC4;--tm-ink:#fff;--tk:#D1495B;--tk-ink:#fff;--tp:#2F6B4F;--tp-ink:#fff;--ti:#5A6572;--ti-ink:#fff;
 --ts-bg:#FBF0C9;--ts-fg:#5C4500;--tm-bg:#ECE6FA;--tm-fg:#45288F;--tk-bg:#FBE4E7;--tk-fg:#8E1F2E;--tp-bg:#E1EEE6;--tp-fg:#1F4A36;--ti-bg:#E9ECE8;--ti-fg:#3E4650}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--tm:#9C80F0;--tm-ink:#140A33;--tk:#F07A8A;--tk-ink:#33070E;--tp:#62B38D;--tp-ink:#0D1A13;--ti:#9AA5B0;--ti-ink:#10151B;
 --ts-bg:#3A3014;--ts-fg:#F7DD85;--tm-bg:#2A2147;--tm-fg:#CDBDFA;--tk-bg:#3F1C22;--tk-fg:#F8B4BE;--tp-bg:#1C3328;--tp-fg:#A9DCC3;--ti-bg:#252E38;--ti-fg:#C6CDD4}}
.t-sport{--c:var(--ts);--ci:var(--ts-ink);--cb:var(--ts-bg);--cf:var(--ts-fg)}
.t-muzyka{--c:var(--tm);--ci:var(--tm-ink);--cb:var(--tm-bg);--cf:var(--tm-fg)}
.t-kultura{--c:var(--tk);--ci:var(--tk-ink);--cb:var(--tk-bg);--cf:var(--tk-fg)}
.t-spotkanie{--c:var(--tp);--ci:var(--tp-ink);--cb:var(--tp-bg);--cf:var(--tp-fg)}
.t-inne{--c:var(--ti);--ci:var(--ti-ink);--cb:var(--ti-bg);--cf:var(--ti-fg)}
.evdate[class*="t-"]{background:var(--c);color:var(--ci)}
.ttag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:4px;background:var(--cb);color:var(--cf);white-space:nowrap}
.tline{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:4px}
.soon{font-size:12px;font-weight:700;color:var(--muted)}
.next{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center;width:100%;text-align:left;background:var(--surface);border:2px solid var(--c);border-radius:14px;padding:18px 20px;margin-bottom:6px}
.next .nd{background:var(--c);color:var(--ci);border-radius:10px;width:96px;text-align:center;padding:10px 0 12px;line-height:1}
.next .nd b{display:block;font-size:44px;font-stretch:125%;font-weight:800}
.next .nd small{font-size:13px;font-weight:700}
.next h3{margin:2px 0 4px;font-size:clamp(20px,3vw,26px);font-stretch:112%;font-weight:800;line-height:1.15}
.next p{margin:0;color:var(--muted);font-size:14px}
.next .soon{font-size:14px;color:var(--ink)}
.evgrid.past .evcard{opacity:.7}
.wrap-seg{flex-wrap:wrap}
.chip.ev-chip{background:var(--c);color:var(--ci)}
.item.ev-item{background:var(--cb);border-color:var(--c);color:var(--cf)}
.item.ev-item .tt span{color:var(--cf)}
.ygrid button.race{background:var(--c);color:var(--ci)}
.dot[class*="t-"]{background:var(--c)}
@media (max-width:520px){.next{grid-template-columns:1fr;gap:12px}.next .nd{width:auto;display:flex;gap:10px;align-items:baseline;justify-content:center;padding:8px}.next .nd b{font-size:32px;display:inline}}

.calrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:14px;font-size:14px;color:var(--muted)}
.calrow a.btn{text-decoration:none;color:var(--ink)}

:root{--shared:#1F2937}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--shared:#CBD5E1}}
.acct{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 4px}
.hello{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 18px}
.hello:hover{border-color:var(--muted)}
.hello div{flex:1}.hello b{display:block;font-size:20px;font-stretch:112%;font-weight:800}.hello span{color:var(--muted);font-size:14px}
.pdot{width:14px;height:14px;border-radius:50%;flex:none}
.mine-cnt{color:var(--ink)}
.mehead{display:flex;gap:12px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.mytask{box-shadow:inset 5px 0 0 var(--pc,transparent);padding-left:20px}
.mytask .mt-meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:3px}
.mytask .notes{margin-top:4px}
.wtag{font-size:12px;font-weight:700;padding:2px 8px;border-radius:4px;white-space:nowrap}
.wtag.shared{background:var(--shared);color:var(--paper)}
.profhead{display:flex;gap:16px;align-items:center;margin-bottom:10px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-top:6px solid var(--pc);border-radius:14px;padding:16px 18px}
.profhead div{flex:1;min-width:180px}
.profhead h2{margin:0;font-size:clamp(22px,3.4vw,28px);font-stretch:115%;font-weight:800;line-height:1.15}
.profhead p{margin:2px 0 0;color:var(--muted)}
.profhead .av{box-shadow:0 0 0 3px var(--surface),0 0 0 6px var(--pc)}
.swatches{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.sw{position:relative;cursor:pointer}
.sw input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.sw span{display:block;width:32px;height:32px;border-radius:50%;background:var(--c);border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.sw input:checked+span{box-shadow:0 0 0 3px var(--ink)}
.sw input:focus-visible+span{outline:2px solid var(--moss);outline-offset:3px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted);margin:0 0 14px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.legend i.evl{background:var(--bib-bg);box-shadow:inset 3px 0 0 var(--bib)}
.chip.task{background:var(--pc);color:#fff}
.chip.task[style*="--shared"]{color:var(--paper)}
.chip.ev-chip{background:var(--cb);color:var(--cf);box-shadow:inset 3px 0 0 var(--c)}
.item.task-item{box-shadow:inset 5px 0 0 var(--pc);padding-left:16px}
.avwrap{display:inline-flex;border-radius:50%;box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--pc)}
.pcard{border-top:5px solid var(--pc,var(--line))}
.pcard.add{border-top-width:1px}
.assign{display:flex;flex-direction:column;gap:2px;border:1px solid var(--line);border-radius:8px;padding:6px;max-height:220px;overflow:auto;background:var(--paper)}
.asg{display:flex;align-items:center;gap:10px;padding:5px 8px;border-radius:6px;font-weight:500;cursor:pointer}
.asg:hover{background:var(--hover)}
.asg input{width:18px;height:18px;accent-color:var(--moss);margin:0}
.asg.team{border-bottom:1px solid var(--line);border-radius:6px 6px 0 0;margin-bottom:4px;padding-bottom:8px}
.asg small{color:var(--muted);font-weight:400}
.asg.off{opacity:.45}

.joinline{margin:12px 0 0!important;font-size:14px}
.badge{display:inline-block;min-width:20px;padding:0 6px;border-radius:10px;background:var(--danger);color:#fff;font-size:12px;font-weight:700;line-height:20px;text-align:center;margin-left:4px}
.pendbox{border-color:var(--bib)}
.pendbox .ghead{background:var(--bib-bg);color:var(--bib-ink)}
.pendbox .row .main{cursor:default}
.pcard .bd span.role-admin{color:var(--paper)}
.pcard .bd span.role-editor{color:var(--bib-ink)}
.pcard .bd span.role-member{color:var(--gray-ink)}

.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media (max-width:520px){.three{grid-template-columns:1fr 1fr}}
.chip.multi{border-radius:0;margin-left:-6px;margin-right:-6px;width:calc(100% + 12px);padding-left:12px}
.chip.multi.s{border-radius:4px 0 0 4px;margin-left:0;width:calc(100% + 6px);padding-left:6px}
.chip.multi.e{border-radius:0 4px 4px 0;margin-right:0;width:calc(100% + 6px)}
.chip.multi.s.e{border-radius:4px;width:100%}
.mcell,.wcol{overflow:visible}
.week .chip.multi{margin-left:-9px;margin-right:-9px;width:calc(100% + 18px)}
.week .chip.multi.s{margin-left:0;width:calc(100% + 9px)}
.week .chip.multi.e{margin-right:0;width:calc(100% + 9px)}
.week .chip.multi.s.e{width:100%}
.orgbar{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:10px 14px}
.orgbar .grow{font-size:14px;color:var(--muted)}
.sched{margin-top:28px;padding-top:22px;border-top:1px solid var(--line)}
.sched .ptitle{margin-bottom:2px}
.schedsub{margin:0 0 14px;color:var(--muted);font-size:14px}
.undated{display:flex;flex-direction:column;gap:6px}
</style>
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <button class="logo" data-go="home" aria-label="Strona główna">Event <span>Kraft</span></button>
    <div class="who" id="who"></div>
  </header>
  <div id="modeBanner"></div>
  <main id="view" aria-live="polite"><div class="loading">Ładowanie…</div></main>
</div>

<dialog id="taskDlg">
  <form id="taskForm" novalidate>
    <h2 id="taskDlgTitle">Nowe zadanie</h2>
    <label class="fld">Co jest do zrobienia<input class="in" name="title" maxlength="140" placeholder="Zamówić medale na bieg"><span class="err" id="taskErr"></span></label>
    <div>
      <label class="fld">Wydarzenie<select class="in" name="event"></select></label>
    </div>
    <div class="fld"><span>Kto to robi</span><div class="assign" id="assignBox"></div><span class="hint" id="assignHint"></span></div>
    <div class="three">
      <label class="fld">Od<input class="in" type="date" name="date"></label>
      <label class="fld">Do <small style="font-weight:400;color:var(--muted)">(kilka dni)</small><input class="in" type="date" name="endDate"></label>
      <label class="fld" id="timeFld">Godzina<input class="in" type="time" name="time"></label>
    </div>
    <p class="hint" style="margin:-4px 0 12px;font-size:13px;color:var(--muted)">Zadanie jednodniowe: wypełnij tylko „Od”. Kilkudniowe: ustaw też „Do”, a pojawi się na wszystkich dniach w kalendarzu.</p>
    <label class="fld">Opis<textarea class="in" name="notes" rows="3" placeholder="Szczegóły, ustalenia, kontakty"></textarea></label>
    <label class="chk"><input type="checkbox" name="done"> Zrobione</label>
    <div class="dacts">
      <button type="button" class="btn danger left" id="taskDel">Usuń</button>
      <button type="button" class="btn" data-close>Anuluj</button>
      <button type="submit" class="btn primary">Zapisz</button>
    </div>
  </form>
</dialog>

<dialog id="eventDlg">
  <form id="eventForm" novalidate>
    <h2 id="eventDlgTitle">Nowe wydarzenie</h2>
    <label class="fld">Rodzaj wydarzenia<select class="in" name="type">
      <option value="sport">🏃 Sportowe</option><option value="muzyka">🎵 Muzyczne</option><option value="kultura">🎭 Kulturalne</option><option value="spotkanie">🤝 Spotkanie</option><option value="inne">📌 Inne</option>
    </select></label>
    <label class="fld">Nazwa<input class="in" name="name" maxlength="80" placeholder="Fort Run 2026"><span class="err" id="eventErr"></span></label>
    <div class="two">
      <label class="fld">Data<input class="in" type="date" name="date"></label>
      <div class="two"><label class="fld">Od<input class="in" type="time" name="time"></label><label class="fld">Do<input class="in" type="time" name="endTime"></label></div>
    </div>
    <label class="fld">Miejsce<input class="in" name="place" maxlength="100" placeholder="Fort Bema, Warszawa"></label>
    <label class="fld">Opis dla uczestników<textarea class="in" name="desc" rows="3" placeholder="Zbiórka, co zabrać, kontakt do koordynatora"></textarea></label>
    <div class="dacts">
      <button type="button" class="btn danger left" id="eventDel">Usuń</button>
      <button type="button" class="btn" data-close>Anuluj</button>
      <button type="submit" class="btn primary">Zapisz</button>
    </div>
  </form>
</dialog>

<dialog id="personDlg">
  <form id="personForm" novalidate>
    <h2 id="personDlgTitle">Nowa osoba</h2>
    <div class="photo">
      <div class="av" id="photoPrev" style="width:84px;height:84px;font-size:28px">?</div>
      <div>
        <label class="btn sm" style="display:inline-block">Wybierz zdjęcie<input type="file" accept="image/*" id="photoIn" hidden></label>
        <button type="button" class="btn sm" id="photoClear">Usuń zdjęcie</button>
      </div>
    </div>
    <label class="fld">Imię i nazwisko<input class="in" name="name" maxlength="60" placeholder="Anna Kowalska"><span class="hint">Tak, jak osoba będzie je wpisywać na stronie wydarzenia.</span><span class="err" id="personErr"></span></label>
    <label class="fld">Pseudonim<input class="in" name="nick" maxlength="30" placeholder="Ania"></label>
    <div class="fld"><span>Kolor w kalendarzu</span><div id="personColors"></div></div>
    <label class="fld">Funkcja w stowarzyszeniu<input class="in" name="func" maxlength="60" placeholder="Skarbniczka"></label>
    <div id="roleFields">
      <label class="fld">Uprawnienia<select class="in" name="role">
        <option value="member">Członek – odhacza swoje zadania</option>
        <option value="editor">Edytor – zarządza zadaniami i wydarzeniami</option>
        <option value="admin">Administrator – pełny dostęp i nadawanie ról</option>
      </select></label>
      <label class="fld" id="pinFld">PIN do logowania<input class="in" name="pin" type="password" inputmode="numeric" maxlength="12" autocomplete="new-password" placeholder="min. 4 cyfry"><span class="hint" id="pinHint"></span></label>
    </div>
    <div class="dacts">
      <button type="button" class="btn danger left" id="personDel">Usuń osobę</button>
      <button type="button" class="btn" data-close>Anuluj</button>
      <button type="submit" class="btn primary">Zapisz</button>
    </div>
  </form>
</dialog>

<datalist id="peopleList"></datalist>
<div class="toast" id="toast" role="status"></div>

<script>
/* =====================================================================
   EVENT KRAFT – planer stowarzyszenia

   WSPÓLNA BAZA DANYCH (Firebase):
   Bez niej dane zapisują się tylko w przeglądarce na jednym urządzeniu.
   Żeby wszyscy widzieli te same zadania, wklej poniżej konfigurację
   z Firebase (console.firebase.google.com → Ustawienia projektu →
   Twoje aplikacje → Konfiguracja SDK), zamiast null:

   const FIREBASE_CONFIG = {
     apiKey: "...",
     authDomain: "...",
     projectId: "...",
     storageBucket: "...",
     messagingSenderId: "...",
     appId: "..."
   };
   ===================================================================== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyClTPdn54xuh3aLrhvJiJUXcCRr1LM29II",
  authDomain: "event-kraft.firebaseapp.com",
  projectId: "event-kraft",
  storageBucket: "event-kraft.firebasestorage.app",
  messagingSenderId: "793899620618",
  appId: "1:793899620618:web:08d7d48a6fb101b5a5c2f3"
};

const ORG='Event Kraft';
const ROLES={member:'Członek',editor:'Edytor',admin:'Administrator'};
const TYPES={sport:{l:'Sportowe',i:'🏃'},muzyka:{l:'Muzyczne',i:'🎵'},kultura:{l:'Kulturalne',i:'🎭'},spotkanie:{l:'Spotkanie',i:'🤝'},inne:{l:'Inne',i:'📌'}};
const typeOf=e=>TYPES[e&&e.type]?e.type:'inne';
const typeTag=e=>`<span class="ttag t-${typeOf(e)}">${TYPES[typeOf(e)].i} ${TYPES[typeOf(e)].l}</span>`;
const state={people:[],tasks:[],events:[]};
const ui={meTab:'zadania',fCal:'all',fType:'all',screen:'home',eventId:null,tab:'zadania',fEvent:'all',fPerson:'all',showDone:false,pview:'month',cursor:new Date(),loginErr:''};
let fs=null,loaded=false;

const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const today=()=>ymd(new Date());
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const weekStart=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x};
const fmt=(s,o)=>new Intl.DateTimeFormat('pl-PL',o).format(typeof s==='string'?parse(s):s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const daysBetween=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const WD=['pon','wt','śr','czw','pt','sob','nd'];
const uid=()=>(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2)).replace(/[^a-zA-Z0-9-]/g,'');
const $=s=>document.querySelector(s);
const norm=s=>String(s||'').toLowerCase().replace(/ł/g,'l').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').trim();
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}};

async function hash(pin){
  const txt='ek-salt:'+pin;
  if(crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(txt));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
  let h=0;for(const c of txt)h=(h*31+c.charCodeAt(0))|0;return 'x'+h;
}
function toast(msg){const t=$('#toast');t.textContent=msg;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',3200)}
const person=id=>state.people.find(p=>p.id===id);
const eventOf=id=>state.events.find(e=>e.id===id);
const evName=id=>{const e=eventOf(id);return e?e.name:'Stowarzyszenie (ogólne)'};
const initials=n=>(n||'?').split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join('');
function avatar(p,s=36){const inner=p&&p.photo?`<img src="${esc(p.photo)}" alt="">`:esc(p?initials(p.name):'?');return `<span class="av" style="width:${s}px;height:${s}px;font-size:${Math.round(s*.38)}px">${inner}</span>`}
const sortByDate=(a,b)=>(a.date||'9999').localeCompare(b.date||'9999')||(a.time||'99').localeCompare(b.time||'99');
const PALETTE=['#2563EB','#DB2777','#EA580C','#7C3AED','#16A34A','#DC2626','#0891B2','#4F46E5','#92400E','#4D7C0F','#A21CAF','#475569'];
const colorOf=p=>p&&PALETTE.includes(p.color)?p.color:(p?PALETTE[Math.abs([...p.id].reduce((a,c)=>a*31+c.charCodeAt(0)|0,7))%PALETTE.length]:'#475569');
function nextColor(){const used=state.people.map(p=>p.color);return PALETTE.find(c=>!used.includes(c))||PALETTE[state.people.length%PALETTE.length]}
const assignees=t=>(t.personIds||(t.personId?[t.personId]:[])).filter(id=>person(id));
const isShared=t=>!!t.all||assignees(t).length>1;
const isMine=(t,pid)=>!!t.all||assignees(t).includes(pid);
const isUnassigned=t=>!t.all&&!assignees(t).length;
const dispName=p=>p?(p.nick?`${p.name} „${p.nick}”`:p.name):'';
const shortName=p=>p?(p.nick||p.name.split(' ')[0]):'';
function whoLabel(t){if(t.all)return 'Cały zespół';const a=assignees(t).map(person);return a.length?a.map(shortName).join(', '):'Nieprzypisane'}
function member(){return person(ls.get('ek-me'))||null}
const tasksForEvent=id=>state.tasks.filter(t=>id==='_general'?!eventOf(t.eventId):t.eventId===id);
function me(){const p=person(ls.get('ek-session'));return p&&(p.role==='editor'||p.role==='admin')?p:null}
const isAdmin=()=>me()?.role==='admin';
const tEnd=t=>t.endDate&&t.endDate>t.date?t.endDate:t.date;
const isMulti=t=>!!t.date&&tEnd(t)!==t.date;
const onDay=(t,d)=>!!t.date&&d>=t.date&&d<=tEnd(t);
const isLate=t=>!t.done&&!!t.date&&tEnd(t)<today();
function dueText(t,short){const o=short?{day:'numeric',month:'short'}:{day:'numeric',month:'long'};
  if(isMulti(t))return fmt(t.date,o)+' – '+fmt(tEnd(t),o)+' ('+(daysBetween(t.date,tEnd(t))+1)+' dni)';
  return 'do '+fmt(t.date,o)+(t.time?(short?' ':', ')+t.time:'')}
function dueHtml(t,short){if(!t.date)return '';const l=isLate(t);return `<span class="${l?'late':''}">${l?'Po terminie · ':''}${isMulti(t)?'🗓 ':''}${dueText(t,short)}</span>`}
const active=()=>state.people.filter(p=>!p.pending);
const pendingList=()=>state.people.filter(p=>p.pending);
const hasAdmin=()=>state.people.some(p=>p.role==='admin');

/* ---------- storage ---------- */
function loadLocal(){try{const s=JSON.parse(ls.get('eventkraft-v1')||'null');if(s){state.people=s.people||[];state.tasks=s.tasks||[];state.events=s.events||[]}}catch(e){}}
function saveLocal(){ls.set('eventkraft-v1',JSON.stringify(state))}
async function put(col,obj){
  try{
    if(fs){const{id,...r}=obj;await fs.collection(col).doc(id).set(r)}
    else{const a=state[col],i=a.findIndex(x=>x.id===obj.id);if(i>=0)a[i]=obj;else a.push(obj);saveLocal();render()}
    return true;
  }catch(e){console.error(e);toast('Nie udało się zapisać. Sprawdź internet i spróbuj ponownie.');return false}
}
async function del(col,id){
  try{
    if(fs)await fs.collection(col).doc(id).delete();
    else{state[col]=state[col].filter(x=>x.id!==id);saveLocal();render()}
    return true;
  }catch(e){console.error(e);toast('Nie udało się usunąć. Spróbuj ponownie.');return false}
}
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
async function init(){
  if(FIREBASE_CONFIG){
    try{
      await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js');
      await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js');
      firebase.initializeApp(FIREBASE_CONFIG);fs=firebase.firestore();
      const got=new Set();
      ['people','tasks','events'].forEach(c=>fs.collection(c).onSnapshot(s=>{
        state[c]=s.docs.map(d=>({id:d.id,...d.data()}));
        if(c==='people')state.people.sort((a,b)=>(a.name||'').localeCompare(b.name||'','pl'));
        got.add(c);if(got.size===3)loaded=true;render();
      },e=>{console.error(e);$('#modeBanner').innerHTML='<div class="banner">Brak dostępu do bazy danych. Sprawdź reguły Firestore w Firebase.</div>'}));
      return;
    }catch(e){console.error(e);fs=null;$('#modeBanner').innerHTML='<div class="banner">Nie udało się połączyć z bazą. Pracujesz w trybie lokalnym.</div>'}
  }else{
    $('#modeBanner').innerHTML='<div class="banner">Tryb próbny: dane zapisują się tylko w tej przeglądarce. Żeby wszyscy widzieli te same zadania, podłącz bazę Firebase (instrukcja na górze pliku).</div>';
  }
  loadLocal();loaded=true;render();
}

/* ---------- routing ---------- */
function readHash(){
  const h=location.hash.replace(/^#\/?/,'').split('/');
  if(h[0]==='e'&&h[1]){ui.screen='event';ui.eventId=h[1]}
  else if(h[0]==='admin'){ui.screen='admin';if(h[1])ui.tab=h[1]}
  else if(h[0]==='dolacz'){ui.screen='join'}
  else if(h[0]==='me'){ui.screen='me';if(h[1])ui.meTab=h[1]}
  else if(h[0]==='login'){ui.screen='login'}
  else ui.screen='home';
}
function go(hash){if(location.hash!==hash)location.hash=hash;else{readHash();render()}}
window.addEventListener('hashchange',()=>{readHash();render();window.scrollTo(0,0)});

/* ---------- kalendarz (.ics + Google) ---------- */
const eventUrl=id=>location.href.split('#')[0]+'#/e/'+id;
const compact=d=>d.replace(/-/g,'');
const hhmm=t=>t.replace(':','')+'00';
function endOf(date,time,endTime){
  if(endTime&&endTime>time)return [date,endTime];
  const d=parse(date),[h,m]=time.split(':').map(Number);d.setHours(h+2,m);
  return [ymd(d),pad(d.getHours())+':'+pad(d.getMinutes())];
}
function icsEsc(s){return String(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n')}
function fold(line){const out=[];let cur='';for(const ch of line){if(new TextEncoder().encode(cur+ch).length>73){out.push(cur);cur=' '+ch}else cur+=ch}out.push(cur);return out.join('\r\n')}
function buildICS(items){
  const stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Event Kraft//Planer//PL','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:'+ORG];
  items.forEach(it=>{
    L.push('BEGIN:VEVENT','UID:'+it.uid+'@eventkraft','DTSTAMP:'+stamp);
    if(it.time&&!it.endDate){const[ed,et]=endOf(it.date,it.time,it.endTime);L.push('DTSTART:'+compact(it.date)+'T'+hhmm(it.time),'DTEND:'+compact(ed)+'T'+hhmm(et))}
    else L.push('DTSTART;VALUE=DATE:'+compact(it.date),'DTEND;VALUE=DATE:'+compact(ymd(addDays(parse(it.endDate||it.date),1))));
    L.push('SUMMARY:'+icsEsc(it.title));
    if(it.place)L.push('LOCATION:'+icsEsc(it.place));
    L.push('DESCRIPTION:'+icsEsc([it.desc,it.url?'Szczegóły i zadania: '+it.url:''].filter(Boolean).join('\n\n')));
    if(it.url)L.push('URL:'+it.url);
    L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(it.title),'TRIGGER:-P1D','END:VALARM','END:VEVENT');
  });
  L.push('END:VCALENDAR');
  return L.map(fold).join('\r\n')+'\r\n';
}
function evItem(e){return {uid:e.id,title:e.name,date:e.date,time:e.time,endTime:e.endTime,place:e.place,desc:e.desc,url:eventUrl(e.id)}}
function downloadICS(name,items){
  if(!items.length)return toast('Nie ma nic z datą do dodania.');
  const blob=new Blob([buildICS(items)],{type:'text/calendar;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name.replace(/[^\p{L}\p{N}\- ]/gu,'').trim().replace(/\s+/g,'-')+'.ics';
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
  toast('Otwórz pobrany plik, żeby dodać do kalendarza');
}
function gcalUrl(e){
  let dates;
  if(e.time){const[ed,et]=endOf(e.date,e.time,e.endTime);dates=compact(e.date)+'T'+hhmm(e.time)+'/'+compact(ed)+'T'+hhmm(et)}
  else dates=compact(e.date)+'/'+compact(ymd(addDays(parse(e.date),1)));
  const q=new URLSearchParams({action:'TEMPLATE',text:e.name,dates,ctz:'Europe/Warsaw',details:[e.desc,'Szczegóły i zadania: '+eventUrl(e.id)].filter(Boolean).join('\n\n'),location:e.place||''});
  return 'https://calendar.google.com/calendar/render?'+q.toString();
}
function calButtons(e){
  if(!e||!e.date)return '';
  return `<div class="calrow"><span>Dodaj do kalendarza:</span><a class="btn sm" href="${esc(gcalUrl(e))}" target="_blank" rel="noopener">Google</a><button class="btn sm" data-ics="event:${e.id}">iPhone / Mac / Outlook</button></div>`;
}

/* ---------- render ---------- */
function render(){
  const m=me(),mb=member();
  let who='';
  if(mb)who+=`<button class="btn sm acct" data-go="me">${avatar(mb,22)}<span>Moje konto</span></button>`;
  if(m)who+=ui.screen==='admin'?`<button class="btn sm" data-go="home">Strona główna</button>`:`<button class="btn sm" data-go="admin">Panel ${m.role==='admin'?'admina':'edytora'}</button>`;
  who+=m?`<button class="btn sm" data-logout>Wyloguj z panelu</button>`:`<button class="btn sm" data-go="login">Dla organizatorów</button>`;
  $('#who').innerHTML=who;
  $('#peopleList').innerHTML=state.people.map(p=>`<option value="${esc(p.name)}">`).join('');
  document.title=ORG;
  if(!loaded){$('#view').innerHTML='<div class="loading">Ładowanie…</div>';return}
  let h;
  if(ui.screen==='event')h=vEvent();
  else if(ui.screen==='me')h=vMe();
  else if(ui.screen==='join')h=vJoin();
  else if(ui.screen==='login')h=(m?(setTimeout(()=>go('#/admin')),''):vLogin());
  else if(ui.screen==='admin')h=m?vAdmin():vLogin();
  else h=vHome();
  $('#view').innerHTML=h;
}
function nameBox(title,sub){
  return `<div class="namebox"><h3>${title}</h3><p>${sub}</p>
    <form class="inrow nameForm" novalidate><input class="in" name="n" list="peopleList" autocomplete="name" placeholder="Anna Kowalska" aria-label="Imię i nazwisko"><button class="btn primary">Dalej</button></form>
    <p class="err nameErr" style="margin:8px 0 0"></p><p class="joinline">Nie ma Cię jeszcze w zespole? <button class="linklike" data-go="dolacz">Dołącz</button></p></div>`;
}
function dateBox(e){
  if(!e)return `<div class="evdate gen">EK</div>`;
  if(!e.date)return `<div class="evdate t-${typeOf(e)}"><b>?</b><small>bez daty</small></div>`;
  return `<div class="evdate t-${typeOf(e)}"><b>${parse(e.date).getDate()}</b><small>${fmt(e.date,{month:'short'}).replace('.','')}</small></div>`;
}
function soon(d){const n=daysBetween(today(),d);if(n<0)return '';if(n===0)return 'dziś';if(n===1)return 'jutro';if(n<7)return 'za '+n+' dni';if(n<14)return 'za tydzień';if(n<60)return 'za '+Math.round(n/7)+' tyg.';return 'za '+Math.round(n/30)+' mies.'}
function evCard(e){
  const id=e?e.id:'_general',list=tasksForEvent(id),mb=member();
  const mine=mb?list.filter(t=>isMine(t,mb.id)&&!t.done).length:0;
  const meta=e?[e.date?fmt(e.date,{weekday:'long',day:'numeric',month:'long'})+(e.time?', '+e.time:''):'',e.place].filter(Boolean).map(esc).join(' · '):'Zadania stałe stowarzyszenia';
  return `<button class="evcard" data-go="e/${id}">${dateBox(e)}<div>${e?`<div class="tline">${typeTag(e)}${e.date?`<span class="soon">${soon(e.date)}</span>`:''}</div>`:''}<h3>${e?esc(e.name):'Stowarzyszenie'}</h3><p>${meta}</p><p>${mb?(mine?`<b class="mine-cnt">${mine} ${mine===1?'Twoje zadanie':'Twoich zadań'}</b>`:'Brak Twoich zadań'):list.length+' '+(list.length===1?'zadanie':'zadań')}</p></div></button>`;
}
function vHome(){
  const t=today(),ft=e=>ui.fType==='all'||typeOf(e)===ui.fType,mb=member();
  const dated=state.events.filter(e=>e.date&&e.date>=t&&ft(e)).sort(sortByDate);
  const nodate=state.events.filter(e=>!e.date&&ft(e));
  const past=state.events.filter(e=>e.date&&e.date<t&&ft(e)).sort(sortByDate).reverse();
  let h='';
  if(mb){const open=state.tasks.filter(x=>isMine(x,mb.id)&&!x.done).length;
    h+=`<button class="hello" data-go="me">${avatar(mb,56)}<div><b>Cześć, ${esc(shortName(mb))}!</b><span>${open?`Masz ${open} ${open===1?'zadanie':'zadań'} do zrobienia.`:'Nie masz zadań do zrobienia.'} Kliknij, żeby otworzyć swoje konto.</span></div><span class="pdot" style="background:${colorOf(mb)}"></span></button>`}
  else h+=nameBox('Twoje konto','Wpisz imię i nazwisko, żeby zobaczyć swoje zadania, kalendarz i ustawić zdjęcie.');
  if(!state.events.length&&!state.tasks.length)
    return h+`<div class="empty" style="margin-top:18px"><h3>Nie ma jeszcze żadnych wydarzeń</h3><p>Organizator doda je w panelu.</p></div>`;
  const used=Object.keys(TYPES).filter(k=>state.events.some(e=>typeOf(e)===k));
  h+=`<div class="bar" style="margin-top:22px"><h2 class="ptitle grow">Wydarzenia</h2>${dated.length?`<button class="btn sm" data-ics="all">Pobierz wszystkie do kalendarza</button>`:''}</div>`;
  if(used.length>1)h+=`<div class="bar"><div class="seg wrap-seg" role="group" aria-label="Rodzaj wydarzenia"><button aria-pressed="${ui.fType==='all'}" data-ftype="all">Wszystkie</button>${used.map(k=>`<button aria-pressed="${ui.fType===k}" data-ftype="${k}">${TYPES[k].i} ${TYPES[k].l}</button>`).join('')}</div></div>`;
  if(dated.length){
    const n=dated[0],l=tasksForEvent(n.id);
    h+=`<p class="sect" style="margin-top:6px">Najbliższe</p><button class="next t-${typeOf(n)}" data-go="e/${n.id}"><div class="nd"><b>${parse(n.date).getDate()}</b><small>${fmt(n.date,{day:'numeric',month:'long'}).replace(/^\d+\s*/,'')}</small></div><div class="nb"><div class="tline">${typeTag(n)}<span class="soon">${soon(n.date)}</span></div><h3>${esc(n.name)}</h3><p>${[fmt(n.date,{weekday:'long'})+(n.time?', godz. '+n.time:''),n.place].filter(Boolean).map(esc).join(' · ')}</p><p>${l.length} ${l.length===1?'zadanie':'zadań'} · Kliknij i zobacz szczegóły</p></div></button>`;
    if(dated.length>1)h+=`<p class="sect">Kolejne</p><div class="evgrid">${dated.slice(1).map(evCard).join('')}</div>`;
  }
  if(nodate.length)h+=`<p class="sect">Termin do ustalenia</p><div class="evgrid">${nodate.map(evCard).join('')}</div>`;
  if(ui.fType==='all'&&tasksForEvent('_general').length)h+=`<p class="sect">Zadania stałe</p><div class="evgrid">${evCard(null)}</div>`;
  if(!dated.length&&!nodate.length&&ui.fType!=='all')h+=`<div class="empty"><h3>Brak nadchodzących wydarzeń tego rodzaju</h3><p>Wybierz inny rodzaj albo „Wszystkie”.</p></div>`;
  if(past.length)h+=`<p class="sect">Minione</p><div class="evgrid past">${past.map(evCard).join('')}</div>`;
  return h;
}
function whoBadges(t,pid){
  if(t.all)return `<span class="wtag shared">👥 Cały zespół</span>`;
  const a=assignees(t);if(a.length<2)return '';
  return `<span class="wtag shared">👥 Wspólne: ${a.filter(id=>id!==pid).map(id=>esc(shortName(person(id)))).join(', ')}</span>`;
}
function myTaskRow(t,pid,showEvent){
  const c=isShared(t)?'var(--shared)':colorOf(person(pid));
  const by=t.done&&t.doneBy&&t.doneBy!==pid&&person(t.doneBy)?` · odhaczył(a) ${esc(shortName(person(t.doneBy)))}`:'';
  return `<label class="mytask ${t.done?'done':''}" style="--pc:${c}"><input type="checkbox" data-toggle="${t.id}" ${t.done?'checked':''}><div><b>${esc(t.title)}</b>
   <span class="mt-meta">${whoBadges(t,pid)}${showEvent?`<span class="tag ${eventOf(t.eventId)?'cat-fort':'cat-stow'}">${esc(evName(t.eventId))}</span>`:''}${dueHtml(t)}${by}</span>${t.notes?`<span class="notes">${esc(t.notes)}</span>`:''}</div></label>`;
}
function vEvent(){
  const id=ui.eventId,e=eventOf(id);
  if(id!=='_general'&&!e)return `<div class="empty"><h3>Nie ma takiego wydarzenia</h3><p>Mogło zostać usunięte albo link jest niepełny.</p><button class="btn primary" data-go="home">Wszystkie wydarzenia</button></div>`;
  const evTasks=tasksForEvent(id);
  if(ui.evCursorFor!==id){ui.evCursorFor=id;ui.pview='month';
    const first=evTasks.filter(t=>t.date&&!t.done&&tEnd(t)>=today()).sort(sortByDate)[0];
    const d=first?first.date:(e&&e.date?e.date:'');ui.cursor=d&&d>today()?parse(d):new Date()}
  const meta=e?[e.date?fmt(e.date,{weekday:'long',day:'numeric',month:'long',year:'numeric'})+(e.time?', godz. '+e.time+(e.endTime&&e.endTime>e.time?'–'+e.endTime:''):''):'',e.place].filter(Boolean).map(esc).join(' · '):'Zadania stałe, niezwiązane z konkretnym wydarzeniem';
  let h=`<p style="margin:0 0 12px"><button class="linklike" data-go="home">‹ Wszystkie wydarzenia</button></p>
  <div class="hero">${e?`<div class="tline" style="margin-bottom:6px">${typeTag(e)}${e.date?`<span class="soon">${soon(e.date)}</span>`:''}</div>`:''}<h2>${e?esc(e.name):'Stowarzyszenie'}</h2><div class="meta">${meta}</div>${e&&e.desc?`<p class="desc">${esc(e.desc)}</p>`:''}${calButtons(e)}</div>`;
  if(me())h+=`<div class="bar orgbar"><span class="grow">Jesteś organizatorem:</span><button class="btn primary" data-new="task" data-ev="${id}">Dodaj zadanie do tego wydarzenia</button>${e?`<button class="btn" data-edit-event="${e.id}">Edytuj wydarzenie</button>`:''}</div>`;
  const p=member();
  if(!p)h+=nameBox('Kim jesteś?','Wpisz imię i nazwisko, żeby zobaczyć swoje zadania przy tym wydarzeniu.');
  else{
    const mine=evTasks.filter(t=>isMine(t,p.id)).sort((a,b)=>(a.done-b.done)||sortByDate(a,b));
    const done=mine.filter(t=>t.done).length;
    h+=`<div class="mehead">${avatar(p,48)}<div style="flex:1;min-width:180px"><b style="font-size:18px">Twoje zadania</b>
      ${mine.length?`<div class="prog" style="max-width:280px"><i style="width:${Math.round(done/mine.length*100)}%;background:${colorOf(p)}"></i></div><span style="color:var(--muted);font-size:14px">${done} z ${mine.length} zrobione</span>`:''}</div>
      ${mine.length?`<button class="btn sm primary" data-new="task" data-ev="${id}">+ Dodaj zadanie</button>`:''}<button class="btn sm" data-go="me">Moje konto</button><button class="btn sm" data-notme>To nie ja</button></div>`;
    if(!mine.length)h+=`<div class="empty"><h3>Nie masz zadań przy tym wydarzeniu</h3><p>${me()?'Dodaj zadanie i przypisz je sobie albo komuś z zespołu.':'Dodaj zadanie, które bierzesz na siebie, albo poczekaj, aż koordynator coś Ci przypisze.'}</p><button class="btn primary" data-new="task" data-ev="${id}">Dodaj zadanie</button></div>`;
    else{
      if(mine.some(t=>t.date&&!t.done))h+=`<div class="calrow" style="margin:0 0 14px"><span>Terminy tych zadań:</span><button class="btn sm" data-ics="mine:${id}">Dodaj do kalendarza</button></div>`;
      if(done===mine.length)h+=`<div class="banner" style="background:var(--moss-bg);color:var(--moss-ink)">Wszystko zrobione. Dziękujemy!</div>`;
      h+=mine.map(t=>myTaskRow(t,p.id,false)).join('');
    }
  }
  const dated=evTasks.filter(t=>t.date),undated=evTasks.filter(t=>!t.date);
  h+=`<div class="sched"><h2 class="ptitle">Harmonogram ${e?'wydarzenia':'zadań'}</h2><p class="schedsub">${evTasks.length?`Wszystkie zadania (${evTasks.length}), ${evTasks.filter(t=>t.done).length} zrobione. Zadania kilkudniowe są rozciągnięte na kolejne dni.`:'Nie ma jeszcze zadań.'}</p>`;
  if(dated.length||(e&&e.date)){
    const inv=[...new Set(evTasks.flatMap(assignees))].map(person).filter(Boolean);
    h+=legendList(inv,evTasks.some(isShared),!!(e&&e.date))+planner({ev:id,pid:null});
  }else if(me())h+=`<div class="empty"><h3>Dodaj pierwsze zadanie</h3><p>Zadania z datą pojawią się tutaj w kalendarzu.</p><button class="btn primary" data-new="task" data-ev="${id}">Dodaj zadanie</button></div>`;
  if(undated.length)h+=`<p class="sect">Bez terminu (${undated.length})</p><div class="undated">${undated.map(t=>`<button class="item task-item ${t.done?'isdone':''}" style="--pc:${taskColor(t)}" ${me()?`data-edit="${t.id}"`:''}><span class="tt"><b>${esc(t.title)}</b><span>${isShared(t)?'👥 ':''}${esc(whoLabel(t))}</span></span></button>`).join('')}</div>`;
  return h+'</div>';
}

/* ---------- moje konto ---------- */
function vMe(){
  const p=member();
  if(!p)return nameBox('Twoje konto','Wpisz imię i nazwisko, żeby otworzyć swoje konto.');
  const open=state.tasks.filter(t=>isMine(t,p.id)&&!t.done).length;
  const tabs=[['zadania','Moje zadania'],['kalendarz','Mój kalendarz'],['profil','Profil']];
  let h=`<div class="profhead" style="--pc:${colorOf(p)}">${avatar(p,72)}<div><h2>${esc(p.name)}</h2><p>${[p.nick?'„'+esc(p.nick)+'”':'',esc(p.func||''),open?open+' do zrobienia':'wszystko zrobione'].filter(Boolean).join(' · ')}</p></div><button class="btn sm" data-notme>To nie ja</button></div>
  <nav class="tabs" role="tablist">${tabs.map(([k,l])=>`<button role="tab" aria-selected="${ui.meTab===k}" data-go="me/${k}">${l}</button>`).join('')}</nav>`;
  if(p.pending)h+=`<div class="banner">Twoje zgłoszenie czeka na zatwierdzenie przez organizatora. Do tego czasu możesz uzupełnić profil.</div>`;
  if(ui.meTab==='profil')return h+vProfile(p);
  if(ui.meTab==='kalendarz')return h+legend(p)+planner({pid:p.id});
  const mine=state.tasks.filter(t=>isMine(t,p.id));
  if(!mine.length)return h+`<div class="empty"><h3>Nie masz jeszcze żadnych zadań</h3><p>Gdy koordynator coś Ci przypisze, pojawi się tutaj. Możesz też dodać zadanie sam(a).</p><button class="btn primary" data-new="task">Dodaj zadanie</button></div>`;
  const todo=mine.filter(t=>!t.done).sort(sortByDate),done=mine.filter(t=>t.done).sort(sortByDate);
  h+=`<div class="bar" style="justify-content:flex-end;margin-bottom:10px"><button class="btn sm primary" data-new="task">+ Dodaj zadanie</button></div>`;
  if(todo.some(t=>t.date))h+=`<div class="calrow" style="margin:0 0 14px"><span>Terminy wszystkich moich zadań:</span><button class="btn sm" data-ics="mineall">Dodaj do kalendarza</button></div>`;
  h+=todo.length?todo.map(t=>myTaskRow(t,p.id,true)).join(''):`<div class="banner" style="background:var(--moss-bg);color:var(--moss-ink)">Wszystko zrobione. Dziękujemy!</div>`;
  if(done.length)h+=`<p class="sect">Zrobione (${done.length})</p>`+done.map(t=>myTaskRow(t,p.id,true)).join('');
  return h;
}
