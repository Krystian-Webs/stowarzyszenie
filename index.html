/* ---------- panel ---------- */
function vAdmin(){
  const pc=pendingList().length;
  const tabs=[['zadania','Zadania'],['wydarzenia','Wydarzenia'],['planer','Kalendarz'],['zespol','Zespół i role'+(pc?` <span class="badge">${pc}</span>`:'')]];
  return `<div class="bar"><button class="btn primary" data-new="task">Dodaj zadanie</button><button class="btn" data-new="event">Dodaj wydarzenie</button><button class="btn" data-new="person">Dodaj osobę</button></div>
  <nav class="tabs" role="tablist">${tabs.map(([k,l])=>`<button role="tab" aria-selected="${ui.tab===k}" data-go="admin/${k}">${l}</button>`).join('')}</nav>`+
  ({zadania:aTasks,wydarzenia:aEvents,planer:aPlanner,zespol:aTeam}[ui.tab]||aTasks)();
}
function evOptions(sel,withAll){return (withAll?`<option value="all" ${sel==='all'?'selected':''}>Wszystkie wydarzenia</option>`:'')+`<option value="_general" ${sel==='_general'?'selected':''}>Stowarzyszenie (ogólne)</option>`+state.events.slice().sort(sortByDate).map(e=>`<option value="${e.id}" ${sel===e.id?'selected':''}>${esc(e.name)}</option>`).join('')}
function adminRow(t,ctxPid){
  const c=isShared(t)?'var(--shared)':colorOf(person(assignees(t)[0]));
  return `<div class="row ${t.done?'done':''}" style="box-shadow:inset 4px 0 0 ${isUnassigned(t)?'transparent':c}"><input type="checkbox" ${t.done?'checked':''} data-toggle="${t.id}" aria-label="Zrobione"><button class="main" data-edit="${t.id}"><span class="t">${esc(t.title)}</span><span class="meta"><span class="tag ${eventOf(t.eventId)?'cat-fort':'cat-stow'}">${esc(evName(t.eventId))}</span>${whoBadges(t,ctxPid)}${dueHtml(t,true)}</span></button></div>`;
}
function aTasks(){
  const all=state.tasks;
  if(!all.length)return `<div class="empty"><h3>Dodaj pierwsze zadanie</h3><p>Przypisz je do jednej osoby, kilku albo całego zespołu.</p><button class="btn primary" data-new="task">Dodaj zadanie</button></div>`;
  const list=all.filter(t=>(ui.showDone||!t.done)&&(ui.fEvent==='all'||(ui.fEvent==='_general'?!eventOf(t.eventId):t.eventId===ui.fEvent)));
  const bar=`<div class="bar"><select class="in" id="fEvent" aria-label="Wydarzenie">${evOptions(ui.fEvent,true)}</select>
    <select class="in" id="fPerson" aria-label="Osoba"><option value="all">Wszyscy</option>${active().map(p=>`<option value="${p.id}" ${ui.fPerson===p.id?'selected':''}>${esc(dispName(p))}</option>`).join('')}<option value="none" ${ui.fPerson==='none'?'selected':''}>Nieprzypisane</option></select>
    <label class="chk"><input type="checkbox" id="showDone" ${ui.showDone?'checked':''}> Pokaż zrobione</label></div>`;
  let groups=[];
  if(ui.fPerson==='all'||ui.fPerson==='team')groups.push({team:true,items:list.filter(t=>t.all)});
  active().forEach(p=>{if(ui.fPerson==='all'||ui.fPerson===p.id)groups.push({p,items:list.filter(t=>!t.all&&assignees(t).includes(p.id))})});
  if(ui.fPerson==='all'||ui.fPerson==='none')groups.push({none:true,items:list.filter(isUnassigned)});
  groups=groups.filter(g=>g.items.length);
  if(!groups.length)return bar+`<div class="empty"><h3>Nic tu nie ma</h3><p>Zmień filtry albo zaznacz „Pokaż zrobione”.</p></div>`;
  return bar+groups.map(g=>{
    const head=g.team?`<span class="av" style="width:40px;height:40px;background:var(--shared);color:var(--paper);font-size:18px">👥</span><div><h3>Cały zespół</h3><div class="sub">Zadania wspólne</div></div>`
      :g.none?`${avatar(null,40)}<div><h3>Nieprzypisane</h3></div>`
      :`<span class="avwrap" style="--pc:${colorOf(g.p)}">${avatar(g.p,40)}</span><div><h3>${esc(dispName(g.p))}</h3><div class="sub">${esc(g.p.func||ROLES[g.p.role]||'')}</div></div>`;
    const open=g.items.filter(t=>!t.done).length;
    return `<section class="group"><div class="ghead">${head}<div class="cnt">${open} do zrobienia</div></div>${g.items.sort((a,b)=>(a.done-b.done)||sortByDate(a,b)).map(t=>adminRow(t,g.p?.id)).join('')}</section>`}).join('');
}
function aEvents(){
  const t0=today(),evs=[...state.events.filter(e=>!e.date||e.date>=t0).sort(sortByDate),...state.events.filter(e=>e.date&&e.date<t0).sort(sortByDate).reverse()];
  if(!evs.length)return `<div class="empty"><h3>Dodaj pierwsze wydarzenie</h3><p>Każde wydarzenie ma własną stronę, którą wysyłasz uczestnikom.</p><button class="btn primary" data-new="event">Dodaj wydarzenie</button></div>`;
  return evs.map(e=>{const l=tasksForEvent(e.id),d=l.filter(t=>t.done).length;
    return `<div class="evrow">${dateBox(e)}<div class="grow"><div class="tline">${typeTag(e)}${e.date&&e.date<t0?'<span class="soon">minione</span>':e.date?`<span class="soon">${soon(e.date)}</span>`:''}</div><h3>${esc(e.name)}</h3><p>${[e.date?fmt(e.date,{weekday:'long',day:'numeric',month:'long',year:'numeric'})+(e.time?', '+e.time:''):'bez daty',e.place].filter(Boolean).map(esc).join(' · ')}</p></div>
    <div><div class="prog"><i style="width:${l.length?Math.round(d/l.length*100):0}%"></i></div><p style="font-size:13px;color:var(--muted);margin:0">${d} z ${l.length} zadań zrobione</p></div>
    <div class="inrow" style="flex:none"><button class="btn sm" data-copy="${e.id}">Kopiuj link</button><button class="btn sm" data-go="e/${e.id}">Otwórz</button><button class="btn sm" data-edit-event="${e.id}">Edytuj</button></div></div>`}).join('');
}
function aTeam(){
  const help=`<div class="roles-help"><b>Członek</b> wpisuje imię, ma swoje konto z zadaniami i kalendarzem, może zmienić zdjęcie, pseudonim i kolor. <b>Edytor</b> loguje się PIN-em do panelu i zarządza zadaniami, wydarzeniami i członkami. <b>Administrator</b> ma pełny dostęp, w tym nadawanie ról i PIN-ów.</div>`;
  const cards=active().map(p=>{const open=state.tasks.filter(t=>isMine(t,p.id)&&!t.done).length;
    return `<article class="pcard" style="--pc:${colorOf(p)}"><button class="ph" data-edit-person="${p.id}" aria-label="Edytuj ${esc(p.name)}">${p.photo?`<img src="${esc(p.photo)}" alt="">`:esc(initials(p.name))}</button><div class="bd"><b>${esc(p.name)}</b>${p.nick?`<span>„${esc(p.nick)}”</span>`:''}<span>${esc(p.func||'')}</span>${p.contact?`<span>${esc(p.contact)}</span>`:''}<span><span class="role role-${p.role||'member'}">${ROLES[p.role]||ROLES.member}</span></span><span>${open} ${open===1?'zadanie':'zadań'} do zrobienia</span><button class="btn sm" data-show-person="${p.id}">Pokaż zadania</button></div></article>`}).join('');
  const pend=pendingList();
  const invite=`<div class="calrow" style="margin:0 0 16px"><span>Link, przez który ludzie sami dołączają do zespołu:</span><button class="btn sm" data-copy-join>Kopiuj link zaproszenia</button></div>`;
  const pendH=pend.length?`<section class="group pendbox"><div class="ghead"><h3>Nowe zgłoszenia (${pend.length})</h3></div>${pend.map(p=>`<div class="row" style="align-items:center">${avatar(p,40)}<div class="main"><span class="t">${esc(dispName(p))}</span><span class="meta">${p.contact?esc(p.contact)+' · ':''}zgłoszenie ${p.joinedAt?fmt(new Date(p.joinedAt),{day:'numeric',month:'long'}):''}</span></div><button class="btn sm primary" data-accept="${p.id}">Zatwierdź</button><button class="btn sm danger" data-reject="${p.id}">Odrzuć</button></div>`).join('')}</section>`:'';
  return help+invite+pendH+`<div class="team">${cards}<button class="pcard add" data-new="person"><span class="plus">+</span>Dodaj osobę</button></div>`;
}
function aPlanner(){
  const sel=`<select class="in" id="fCal" aria-label="Czyj kalendarz"><option value="all">Wszyscy</option>${active().map(p=>`<option value="${p.id}" ${ui.fCal===p.id?'selected':''}>${esc(dispName(p))}</option>`).join('')}</select>`;
  const pid=ui.fCal!=='all'&&person(ui.fCal)?ui.fCal:null;
  return `<div class="bar"><span style="font-size:14px;color:var(--muted)">Pokaż kalendarz:</span>${sel}</div>`+legend(pid?person(pid):null)+planner({pid});
}

/* ---------- kalendarz (widoki) ---------- */
function itemsOn(d,o={}){
  const ev=state.events.filter(e=>e.date===d&&(!o.ev||e.id===o.ev)).map(e=>({...e,isEvent:true,title:e.name}));
  const inEv=t=>!o.ev||(o.ev==='_general'?!eventOf(t.eventId):t.eventId===o.ev);
  return ev.concat(state.tasks.filter(t=>onDay(t,d)&&(!o.pid||isMine(t,o.pid))&&inEv(t)).sort((a,b)=>(isMulti(b)-isMulti(a))||sortByDate(a,b)||(a.id<b.id?-1:1)));
}
function taskColor(t,pid){if(isShared(t))return 'var(--shared)';const a=assignees(t);if(!a.length)return 'var(--muted)';return colorOf(person(pid&&a.includes(pid)?pid:a[0]))}
function taskAttr(t){return me()?`data-edit="${t.id}"`:(member()&&isMine(t,member().id)?`data-go="me/zadania"`:'')}
function chip(t,o,d){
  if(t.isEvent)return `<button class="chip ev-chip t-${typeOf(t)}" ${me()?`data-edit-event="${t.id}"`:`data-go="e/${t.id}"`} title="${esc(t.title)}">${TYPES[typeOf(t)].i} ${t.time?`<span class="tm">${t.time}</span>`:''}${esc(t.title)}</button>`;
  const multi=isMulti(t),st=d===t.date,en=d===tEnd(t),show=!multi||st||parse(d).getDay()===1;
  const lbl=isShared(t)?'👥 ':(!o.pid&&assignees(t).length?esc(shortName(person(assignees(t)[0])))+': ':'');
  const tip=t.title+' – '+whoLabel(t)+(multi?' ('+dueText(t,true)+')':'');
  return `<button class="chip task ${t.done?'done':''} ${multi?'multi':''} ${multi&&st?'s':''} ${multi&&en?'e':''}" style="--pc:${taskColor(t,o.pid)}" ${taskAttr(t)} title="${esc(tip)}">${show?`${t.time&&!multi?`<span class="tm">${t.time}</span>`:''}${lbl}${esc(t.title)}`:'&nbsp;'}</button>`;
}
function itemBtn(t,o){
  if(t.isEvent)return `<button class="item ev-item t-${typeOf(t)}" ${me()?`data-edit-event="${t.id}"`:`data-go="e/${t.id}"`}><span class="tm">${t.time||TYPES[typeOf(t)].i}</span><span class="tt"><b>${esc(t.title)}</b><span>${TYPES[typeOf(t)].l}${t.place?' · '+esc(t.place):''}</span></span></button>`;
  return `<button class="item task-item ${t.done?'isdone':''}" style="--pc:${taskColor(t,o.pid)}" ${taskAttr(t)}><span class="tm">${isMulti(t)?'🗓':t.time||'–'}</span><span class="tt"><b>${esc(t.title)}</b><span>${o.ev?'':esc(evName(t.eventId))+' · '}${isShared(t)?'👥 ':''}${esc(whoLabel(t))}${isMulti(t)?' · '+dueText(t,true):''}</span></span></button>`;
}
function planner(o={}){
  const c=ui.cursor,v=ui.pview;let title='',body='';
  if(v==='day'){
    const d=ymd(c);title=fmt(c,{weekday:'long',day:'numeric',month:'long',year:'numeric'});const l=itemsOn(d,o);
    body=(l.length?`<div style="display:flex;flex-direction:column;gap:6px">${l.map(t=>itemBtn(t,o)).join('')}</div>`:`<div class="empty"><h3>Wolny dzień</h3><p>Nic nie jest zaplanowane na ten dzień.</p></div>`)+
      (me()?`<div class="bar" style="margin-top:14px"><button class="btn" data-new="task" data-date="${d}" data-ev="${o.ev||''}">Dodaj zadanie na ten dzień</button>${o.ev?'':`<button class="btn" data-new="event" data-date="${d}">Dodaj wydarzenie</button>`}</div>`:'');
  }else if(v==='week'){
    const s=weekStart(c),e=addDays(s,6);title=`${fmt(s,{day:'numeric',month:'short'})} – ${fmt(e,{day:'numeric',month:'short',year:'numeric'})}`;
    body='<div class="week">'+[...Array(7)].map((_,i)=>{const dd=addDays(s,i),d=ymd(dd);return `<div class="wcol ${d===today()?'today':''}"><button class="dhead" data-day="${d}"><small>${WD[i]}</small><b>${dd.getDate()}</b></button>${itemsOn(d,o).map(t=>chip(t,o,d)).join('')}</div>`}).join('')+'</div>';
  }else if(v==='month'){
    title=fmt(c,{month:'long',year:'numeric'});const s=weekStart(new Date(c.getFullYear(),c.getMonth(),1));
    body='<div class="month">'+WD.map(w=>`<div class="wd">${w}</div>`).join('')+[...Array(42)].map((_,i)=>{const dd=addDays(s,i),d=ymd(dd),it=itemsOn(d,o);
      return `<div class="mcell ${dd.getMonth()!==c.getMonth()?'out':''} ${d===today()?'today':''}"><button class="dn" data-day="${d}">${dd.getDate()}</button>${it.slice(0,3).map(t=>chip(t,o,d)).join('')}${it.length>3?`<button class="more" data-day="${d}">+${it.length-3} więcej</button>`:''}<div class="dots">${it.map(t=>`<span class="dot ${t.isEvent?'t-'+typeOf(t):''}" style="${t.isEvent?'':'background:'+taskColor(t,o.pid)}"></span>`).join('')}</div></div>`}).join('')+'</div>';
  }else{
    const y=c.getFullYear();title=String(y);
    const tmap=new Map();
    state.tasks.filter(t=>t.date&&(!o.pid||isMine(t,o.pid))&&(!o.ev||(o.ev==='_general'?!eventOf(t.eventId):t.eventId===o.ev))).forEach(t=>{
      for(let d=t.date,n=0;d<=tEnd(t)&&n<400;d=ymd(addDays(parse(d),1)),n++)if(!tmap.has(d))tmap.set(d,taskColor(t,o.pid))});
    const ed=new Map(state.events.filter(e=>e.date&&(!o.ev||e.id===o.ev)).map(e=>[e.date,typeOf(e)]));
    body='<div class="year">'+[...Array(12)].map((_,m)=>{const f=new Date(y,m,1),off=(f.getDay()+6)%7,n=new Date(y,m+1,0).getDate();
      return `<div class="ymon"><h4><button data-month="${m}">${fmt(f,{month:'long'})}</button></h4><div class="ygrid">${WD.map(w=>`<span class="h">${w[0]}</span>`).join('')}${'<span></span>'.repeat(off)}${[...Array(n)].map((_,i)=>{const d=ymd(new Date(y,m,i+1));
        const cls=ed.has(d)?'race t-'+ed.get(d):tmap.has(d)?'has':'';const st=!ed.has(d)&&tmap.has(d)?` style="background:${tmap.get(d)};color:#fff"`:'';
        return `<button class="${cls} ${d===today()?'today':''}"${st} data-day="${d}">${i+1}</button>`}).join('')}</div></div>`}).join('')+'</div>';
  }
  return `<div class="bar"><div class="seg" role="group" aria-label="Zakres">${[['day','Dzień'],['week','Tydzień'],['month','Miesiąc'],['year','Rok']].map(([k,l])=>`<button aria-pressed="${v===k}" data-pview="${k}">${l}</button>`).join('')}</div>
  <div class="seg"><button data-nav="-1" aria-label="Wstecz">‹</button><button data-nav="0">Dziś</button><button data-nav="1" aria-label="Dalej">›</button></div>
  <h2 class="ptitle grow" style="text-transform:${v==='day'?'none':'capitalize'}">${title}</h2></div>`+body;
}

/* ---------- zdjęcia ---------- */
function readPhoto(file,cb){const r=new FileReader();
  r.onload=()=>{const img=new Image();img.onload=()=>{const S=240,cv=document.createElement('canvas');cv.width=cv.height=S;const m=Math.min(img.width,img.height);
    cv.getContext('2d').drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,S,S);cb(cv.toDataURL('image/jpeg',.82))};
    img.onerror=()=>toast('Nie udało się wczytać zdjęcia. Wybierz plik JPG lub PNG.');img.src=r.result};r.readAsDataURL(file)}

/* ---------- okna edycji ---------- */
let editTask=null,editEvent=null,editPerson=null,photoData='',profPhoto=undefined;
let selfMode=null;
function openTask(t,preset={}){
  editTask=t||null;const f=$('#taskForm');selfMode=!me()&&preset.self?person(preset.self):null;
  $('#taskDlgTitle').textContent=t?'Edytuj zadanie':selfMode?'Nowe zadanie dla Ciebie':'Nowe zadanie';
  const d=t||{title:'',eventId:preset.eventId||(ui.fEvent!=='all'&&ui.fEvent!=='_general'?ui.fEvent:''),personIds:ui.fPerson!=='all'&&ui.fPerson!=='none'?[ui.fPerson]:[],date:preset.date||'',time:'',notes:'',done:false,all:false};
  f.event.innerHTML=evOptions(eventOf(d.eventId)?d.eventId:'_general');
  const ids=assignees(d);
  $('#assignBox').innerHTML=`<label class="asg team"><input type="checkbox" name="all" ${d.all?'checked':''}><span class="av" style="width:28px;height:28px;background:var(--shared);color:var(--paper);font-size:14px">👥</span><span>Cały zespół <small>(wspólne)</small></span></label>`+
    active().map(p=>`<label class="asg"><input type="checkbox" name="pid" value="${p.id}" ${ids.includes(p.id)?'checked':''}><span class="avwrap" style="--pc:${colorOf(p)}">${avatar(p,28)}</span><span>${esc(dispName(p))}</span></label>`).join('')+
    (active().length?'':`<p class="hint">Najpierw dodaj osoby w zakładce Zespół.</p>`);
  if(selfMode)$('#assignBox').innerHTML=`<label class="asg"><input type="checkbox" checked disabled><span class="avwrap" style="--pc:${colorOf(selfMode)}">${avatar(selfMode,28)}</span><span>${esc(dispName(selfMode))}</span></label>`;
  syncAssign();
  f.title.value=d.title;f.date.value=d.date||'';f.endDate.value=d.endDate&&d.endDate>d.date?d.endDate:'';f.time.value=d.time||'';f.notes.value=d.notes||'';f.done.checked=!!d.done;
  $('#taskDel').style.display=t?'':'none';$('#taskErr').textContent='';$('#taskDlg').showModal();f.title.focus();
}
function syncAssign(){if(selfMode){$('#assignHint').textContent='Zadanie zostanie przypisane do Ciebie. Organizator zobaczy je w panelu.';return}
  const all=$('#taskForm').querySelector('[name=all]');if(!all)return;
  $('#taskForm').querySelectorAll('[name=pid]').forEach(x=>{x.disabled=all.checked;x.closest('label').classList.toggle('off',all.checked)});
  const n=[...$('#taskForm').querySelectorAll('[name=pid]:checked')].length;
  $('#assignHint').textContent=all.checked?'Zadanie wspólne dla wszystkich. Wystarczy, że jedna osoba je odhaczy.':n>1?'Zadanie wspólne dla zaznaczonych osób.':n===1?'Zadanie jednej osoby.':'Nikt nie jest przypisany.'}
$('#taskForm').addEventListener('change',e=>{if(e.target.name==='all'||e.target.name==='pid')syncAssign()});
$('#taskForm').title.addEventListener('input',()=>$('#taskErr').textContent='');
$('#taskForm').addEventListener('submit',async e=>{e.preventDefault();const f=e.target,title=f.title.value.trim();
  if(!title){$('#taskErr').textContent='Wpisz, co jest do zrobienia.';f.title.focus();return}
  let sd=f.date.value,ed=f.endDate.value;
  if(ed&&!sd){sd=ed;ed=''}
  if(ed&&ed<sd){$('#taskErr').textContent='Data „do” nie może być wcześniejsza niż „od”.';f.endDate.focus();return}
  if(ed===sd)ed='';
  const all=selfMode?false:f.querySelector('[name=all]').checked,ids=selfMode?[selfMode.id]:all?[]:[...f.querySelectorAll('[name=pid]:checked')].map(x=>x.value);
  const done=f.done.checked;
  const t={id:editTask?editTask.id:uid(),title,eventId:f.event.value==='_general'?'':f.event.value,personIds:ids,all,date:sd,endDate:ed,time:ed?'':f.time.value,notes:f.notes.value.trim(),done,doneBy:done?(editTask?.done?editTask.doneBy||'':me()?.id||''):'',created:editTask?.created||Date.now(),createdBy:editTask?.createdBy||me()?.id||selfMode?.id||''};
  if(await put('tasks',t)){$('#taskDlg').close();toast(editTask?'Zapisano zmiany':'Dodano zadanie')}});
$('#taskDel').addEventListener('click',async()=>{if(editTask&&confirm('Usunąć zadanie „'+editTask.title+'”?')&&await del('tasks',editTask.id)){$('#taskDlg').close();toast('Usunięto')}});

function openEvent(ev,preset={}){
  editEvent=ev||null;const f=$('#eventForm');
  $('#eventDlgTitle').textContent=ev?'Edytuj wydarzenie':'Nowe wydarzenie';
  f.type.value=typeOf(ev);f.name.value=ev?.name||'';f.date.value=ev?.date||preset.date||'';f.time.value=ev?.time||'';f.endTime.value=ev?.endTime||'';f.place.value=ev?.place||'';f.desc.value=ev?.desc||'';
  $('#eventDel').style.display=ev?'':'none';$('#eventErr').textContent='';$('#eventDlg').showModal();f.name.focus();
}
$('#eventForm').name.addEventListener('input',()=>$('#eventErr').textContent='');
$('#eventForm').addEventListener('submit',async e=>{e.preventDefault();const f=e.target,name=f.name.value.trim();
  if(!name){$('#eventErr').textContent='Wpisz nazwę wydarzenia.';f.name.focus();return}
  const ev={id:editEvent?editEvent.id:uid(),type:f.type.value,name,date:f.date.value,time:f.time.value,endTime:f.endTime.value,place:f.place.value.trim(),desc:f.desc.value.trim()};
  if(await put('events',ev)){$('#eventDlg').close();toast(editEvent?'Zapisano zmiany':'Dodano wydarzenie')}});
$('#eventDel').addEventListener('click',async()=>{if(!editEvent)return;const n=tasksForEvent(editEvent.id).length;
  if(confirm('Usunąć wydarzenie „'+editEvent.name+'”?'+(n?' Jego zadania ('+n+') przejdą do zadań ogólnych.':''))&&await del('events',editEvent.id)){$('#eventDlg').close();toast('Usunięto')}});

function setPhoto(src,name){photoData=src||'';$('#photoPrev').innerHTML=src?`<img src="${src}" alt="">`:esc(initials(name))}
function syncPin(){const f=$('#personForm'),priv=f.role.value!=='member';$('#pinFld').style.display=priv?'':'none';
  $('#pinHint').textContent=editPerson&&editPerson.pinHash?'Zostaw puste, żeby nie zmieniać PIN-u.':'Ta osoba poda PIN przy logowaniu do panelu.'}
function openPerson(p){
  editPerson=p||null;const f=$('#personForm'),adm=isAdmin();
  $('#personDlgTitle').textContent=p?'Edytuj osobę':'Nowa osoba';
  f.name.value=p?.name||'';f.nick.value=p?.nick||'';f.func.value=p?.func||'';f.role.value=p?.role||'member';f.pin.value='';setPhoto(p?.photo||'',p?.name);
  $('#personColors').innerHTML=swatches('pcolor',p?colorOf(p):nextColor());
  $('#roleFields').style.display=adm?'':'none';syncPin();
  $('#personDel').style.display=p&&(adm||p.role==='member')&&p.id!==me()?.id?'':'none';$('#personErr').textContent='';$('#personDlg').showModal();f.name.focus();
}
$('#personForm').role.addEventListener('change',syncPin);
$('#personForm').name.addEventListener('input',e=>{$('#personErr').textContent='';if(!photoData)setPhoto('',e.target.value)});
$('#photoIn').addEventListener('change',e=>{const file=e.target.files[0];if(file)readPhoto(file,setPhoto);e.target.value=''});
$('#photoClear').addEventListener('click',()=>setPhoto('',$('#personForm').name.value));
$('#personForm').addEventListener('submit',async e=>{e.preventDefault();const f=e.target,name=f.name.value.trim(),err=m=>{$('#personErr').textContent=m};
  if(!name)return err('Wpisz imię i nazwisko.');
  if(state.people.some(p=>norm(p.name)===norm(name)&&p.id!==editPerson?.id))return err('Osoba o takim imieniu już jest. Dodaj np. drugą literę nazwiska.');
  const adm=isAdmin();let role=editPerson?.role||'member',pinHash=editPerson?.pinHash||'';
  if(adm){
    role=f.role.value;
    if(editPerson&&editPerson.role==='admin'&&role!=='admin'&&state.people.filter(p=>p.role==='admin').length<2)return err('To jedyny administrator. Najpierw nadaj tę rolę komuś innemu.');
    const pin=f.pin.value.trim();
    if(role!=='member'){if(pin){if(!/^\d{4,12}$/.test(pin))return err('PIN musi mieć od 4 do 12 cyfr.');pinHash=await hash(pin)}else if(!pinHash)return err('Ustaw PIN, żeby ta osoba mogła się zalogować do panelu.')}
    else pinHash='';
  }
  const col=f.querySelector('[name=pcolor]:checked')?.value||nextColor();
  const p={...(editPerson||{}),id:editPerson?editPerson.id:uid(),name,nick:f.nick.value.trim(),func:f.func.value.trim(),role,pinHash,photo:photoData,color:col};
  if(await put('people',p)){$('#personDlg').close();toast(editPerson?'Zapisano zmiany':'Dodano osobę')}});
$('#personDel').addEventListener('click',async()=>{if(editPerson&&confirm('Usunąć '+editPerson.name+'? Jej zadania staną się nieprzypisane.')&&await del('people',editPerson.id)){$('#personDlg').close();toast('Usunięto')}});
document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>b.closest('dialog').close()));

/* ---------- zdarzenia ---------- */
document.addEventListener('submit',async e=>{
  const f=e.target;
  if(f.classList.contains('nameForm')){e.preventDefault();const n=norm(f.n.value),errEl=f.parentElement.querySelector('.nameErr');
    if(!n){errEl.textContent='Wpisz imię i nazwisko.';return}
    const p=state.people.find(x=>norm(x.name)===n)||(()=>{const byNick=state.people.filter(x=>x.nick&&norm(x.nick)===n);return byNick.length===1?byNick[0]:null})();
    if(!p){ui.prefill=f.n.value.trim();errEl.innerHTML='Nie ma takiej osoby na liście. Sprawdź pisownię albo <button type="button" class="linklike" data-go="dolacz">dołącz do zespołu</button>.';return}
    ls.set('ek-me',p.id);toast('Cześć, '+shortName(p)+'!');if(ui.screen==='home')go('#/me');else render()}
  else if(f.id==='joinForm'){e.preventDefault();const name=f.name.value.trim().replace(/\s+/g,' '),err=m=>{$('#joinErr').textContent=m};
    if(name.split(' ').length<2)return err('Wpisz imię i nazwisko.');
    if(state.people.some(p=>norm(p.name)===norm(name)))return err('Osoba o takim imieniu już jest w zespole. Jeśli to Ty, wróć i wpisz swoje imię na stronie głównej.');
    const p={id:uid(),name,nick:f.nick.value.trim(),contact:f.contact.value.trim(),func:'',role:'member',pinHash:'',photo:joinPhoto,color:f.querySelector('[name=color]:checked')?.value||nextColor(),pending:true,joinedAt:Date.now()};
    if(await put('people',p)){joinPhoto='';ui.prefill='';ls.set('ek-me',p.id);toast('Zgłoszenie wysłane');go('#/me/profil')}}
  else if(f.id==='profileForm'){e.preventDefault();const p=member();if(!p)return;
    const upd={...p,nick:f.nick.value.trim(),color:f.querySelector('[name=color]:checked')?.value||colorOf(p)};
    if(profPhoto!==undefined)upd.photo=profPhoto;
    if(await put('people',upd)){profPhoto=undefined;toast('Zapisano profil')}}
  else if(f.id==='loginForm'){e.preventDefault();const p=state.people.find(x=>norm(x.name)===norm(f.n.value));
    if(!p||p.role==='member'||!p.pinHash||p.pinHash!==await hash(f.p.value.trim())){ui.loginErr='Nieprawidłowe imię lub PIN.';render();return}
    ui.loginErr='';ls.set('ek-session',p.id);if(!member())ls.set('ek-me',p.id);toast('Witaj, '+shortName(p));go('#/admin')}
  else if(f.id==='setupForm'){e.preventDefault();const n=f.n.value.trim(),p1=f.p.value.trim();
    if(!n){ui.loginErr='Wpisz imię i nazwisko.';return render()}
    if(!/^\d{4,12}$/.test(p1)){ui.loginErr='PIN musi mieć od 4 do 12 cyfr.';return render()}
    if(p1!==f.p2.value.trim()){ui.loginErr='PIN-y się różnią.';return render()}
    const p={id:uid(),name:n,nick:'',func:'Administrator',role:'admin',pinHash:await hash(p1),photo:'',color:PALETTE[0]};
    if(await put('people',p)){ui.loginErr='';ls.set('ek-session',p.id);ls.set('ek-me',p.id);toast('Konto administratora gotowe');go('#/admin/zespol')}}
});
document.addEventListener('click',async e=>{
  const g=s=>e.target.closest(s);let el;
  if(el=g('[data-go]')){e.preventDefault();const d=el.dataset.go;go('#/'+(d==='home'?'':d));return}
  if(el=g('[data-logout]')){ls.set('ek-session',null);toast('Wylogowano z panelu');go('#/');return}
  if(el=g('[data-notme]')){ls.set('ek-me',null);profPhoto=undefined;if(ui.screen==='me')go('#/');else render();return}
  if(el=g('#profPhotoClear')){profPhoto='';$('#profPrev').innerHTML=esc(initials(member()?.name));return}
  if(el=g('[data-new]')){const k=el.dataset.new;
    if(!me()){if(k!=='task')return;const mb=member();
      if(!mb)return toast('Najpierw wpisz swoje imię i nazwisko.');
      if(mb.pending)return toast('Poczekaj, aż organizator zatwierdzi Twoje zgłoszenie.');
      return openTask(null,{date:el.dataset.date||'',eventId:el.dataset.ev||'',self:mb.id})}
    if(k==='task')openTask(null,{date:el.dataset.date||'',eventId:el.dataset.ev||''});else if(k==='event')openEvent(null,{date:el.dataset.date||''});else openPerson();return}
  if(el=g('[data-edit]')){const t=state.tasks.find(x=>x.id===el.dataset.edit);if(t&&me())openTask(t);return}
  if(el=g('[data-edit-event]')){const ev=eventOf(el.dataset.editEvent);if(ev&&me())openEvent(ev);return}
  if(el=g('[data-edit-person]')){const p=person(el.dataset.editPerson);if(p&&me()){if(!isAdmin()&&p.role!=='member')return toast('Tylko administrator może edytować organizatorów.');openPerson(p)}return}
  if(el=g('[data-show-person]')){ui.fPerson=el.dataset.showPerson;ui.fEvent='all';ui.showDone=false;go('#/admin/zadania');return}
  if(el=g('[data-copy]')){const url=eventUrl(el.dataset.copy);
    try{await navigator.clipboard.writeText(url);toast('Skopiowano link do wydarzenia')}catch(err){prompt('Skopiuj link:',url)}return}
  if(el=g('[data-ics]')){const[k,id]=el.dataset.ics.split(':'),p=member();
    const tItem=t=>{const ev=eventOf(t.eventId);return {uid:'task-'+t.id,title:(isShared(t)?'👥 ':'')+'Zadanie: '+t.title+(ev?' ('+ev.name+')':''),date:t.date,endDate:isMulti(t)?tEnd(t):'',time:t.time,place:ev?.place,desc:[t.notes,isShared(t)?'Wspólne: '+whoLabel(t):''].filter(Boolean).join('\n'),url:ev?eventUrl(ev.id):location.href.split('#')[0]+'#/me'}};
    if(k==='event'){const ev=eventOf(id);if(ev)downloadICS(ev.name,[evItem(ev)])}
    else if(k==='all'){const t0=today();downloadICS(ORG+' wydarzenia',state.events.filter(e=>e.date&&e.date>=t0&&(ui.fType==='all'||typeOf(e)===ui.fType)).map(evItem))}
    else if(k==='mine'&&p){const ev=eventOf(id);downloadICS('Moje zadania '+(ev?ev.name:''),tasksForEvent(id).filter(t=>isMine(t,p.id)&&t.date&&!t.done).map(tItem))}
    else if(k==='mineall'&&p)downloadICS('Moje zadania '+ORG,state.tasks.filter(t=>isMine(t,p.id)&&t.date&&!t.done).map(tItem));
    return}
  if(el=g('[data-accept]')){const p=person(el.dataset.accept);if(p&&me()&&await put('people',{...p,pending:false}))toast('Dodano '+shortName(p)+' do zespołu');return}
  if(el=g('[data-reject]')){const p=person(el.dataset.reject);if(p&&me()&&confirm('Odrzucić zgłoszenie: '+p.name+'?')&&await del('people',p.id))toast('Odrzucono zgłoszenie');return}
  if(el=g('[data-copy-join]')){const url=location.href.split('#')[0]+'#/dolacz';try{await navigator.clipboard.writeText(url);toast('Skopiowano link zaproszenia')}catch(err){prompt('Skopiuj link:',url)}return}
  if(el=g('[data-ftype]')){ui.fType=el.dataset.ftype;render();return}
  if(el=g('[data-pview]')){ui.pview=el.dataset.pview;render();return}
  if(el=g('[data-day]')){ui.cursor=parse(el.dataset.day);ui.pview='day';render();return}
  if(el=g('[data-month]')){ui.cursor=new Date(ui.cursor.getFullYear(),+el.dataset.month,1);ui.pview='month';render();return}
  if(el=g('[data-nav]')){const n=+el.dataset.nav,c=ui.cursor;
    ui.cursor=n===0?new Date():ui.pview==='day'?addDays(c,n):ui.pview==='week'?addDays(c,7*n):ui.pview==='month'?new Date(c.getFullYear(),c.getMonth()+n,1):new Date(c.getFullYear()+n,c.getMonth(),1);render();return}
});
document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.id==='fEvent'){ui.fEvent=t.value;render()}
  else if(t.id==='fPerson'){ui.fPerson=t.value;render()}
  else if(t.id==='fCal'){ui.fCal=t.value;render()}
  else if(t.id==='showDone'){ui.showDone=t.checked;render()}
  else if(t.id==='joinPhoto'){const file=t.files[0];if(file)readPhoto(file,src=>{joinPhoto=src;$('#joinPrev').innerHTML=`<img src="${src}" alt="">`});t.value=''}
  else if(t.id==='profPhoto'){const file=t.files[0];if(file)readPhoto(file,src=>{profPhoto=src;$('#profPrev').innerHTML=`<img src="${src}" alt="">`});t.value=''}
  else if(t.name==='color'&&t.closest('#profileForm')){$('.profhead')?.style.setProperty('--pc',t.value)}
  else if(t.dataset.toggle){const task=state.tasks.find(x=>x.id===t.dataset.toggle);if(!task)return;
    const by=member()?.id||me()?.id||'';
    const ok=await put('tasks',{...task,done:t.checked,doneAt:t.checked?Date.now():null,doneBy:t.checked?by:''});
    if(!ok)t.checked=!t.checked;else if(t.checked)toast('Odhaczone')}
});
readHash();init();
</script>
</body>
</html>
